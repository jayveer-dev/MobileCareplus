name: Feature idea
description: Something you'd like Mobile Care Plus to do.
labels: [idea]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The task you have in mind, e.g. "move my notes from my old Android to my new iPhone".
    validations:
      required: true
  - type: dropdown
    id: phones
    attributes:
      label: Which phones?
      multiple: true
      options:
        - iPhone
        - Android
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today? (optional)
