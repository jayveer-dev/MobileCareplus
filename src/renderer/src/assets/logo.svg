<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Mobile Care Plus app icon: the in-app logo (blue-to-teal tile, white phone) with a "plus" badge. -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="120" y1="40" x2="904" y2="984">
      <stop offset="0" stop-color="#2b4fd8"/>
      <stop offset="1" stop-color="#19a3a3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#shine)"/>
  <!-- phone -->
  <rect x="318" y="196" width="340" height="604" rx="92" fill="none" stroke="#fff" stroke-width="60"/>
  <rect x="436" y="266" width="104" height="30" rx="15" fill="#fff"/>
  <!-- plus badge, set off from the phone by a ring of the background -->
  <circle cx="676" cy="716" r="176" fill="url(#bg)"/>
  <circle cx="676" cy="716" r="140" fill="#fff"/>
  <rect x="656" y="636" width="40" height="160" rx="20" fill="#2b4fd8"/>
  <rect x="596" y="696" width="160" height="40" rx="20" fill="#2b4fd8"/>
</svg>
